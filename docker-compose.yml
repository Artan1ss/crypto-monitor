services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: btc_monitor
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      # 5433 avoids collisions with a locally installed Windows PostgreSQL service.
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d btc_monitor"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
